name: iOS Build
on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
      
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: Install xcodegen
        run: brew install xcodegen
      
      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate
      
      - name: List project info
        run: |
          cd ios
          xcodebuild -list -project ChumianBrowser.xcodeproj
      
      - name: Build for Simulator
        run: |
          cd ios
          xcodebuild build \
            -project ChumianBrowser.xcodeproj \
            -scheme ChumianBrowser \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES
      
      - name: Find and package .app
        run: |
          cd ios
          find ~/Library/Developer/Xcode/DerivedData -name "ChumianBrowser.app" -type d -path "*/Debug-iphonesimulator/*" | head -1 | xargs -I {} dirname {} | xargs -I {} sh -c 'cd "{}" && zip -r /tmp/ChumianBrowser-simulator.zip ChumianBrowser.app'
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chumian-browser-ios-simulator
          path: /tmp/ChumianBrowser-simulator.zip
          retention-days: 90
      
      - name: Build for Generic iOS Device
        run: |
          cd ios
          xcodebuild build \
            -project ChumianBrowser.xcodeproj \
            -scheme ChumianBrowser \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO
      
      - name: Find and package Device .app
        run: |
          cd ios
          find ~/Library/Developer/Xcode/DerivedData -name "ChumianBrowser.app" -type d -path "*/Debug-iphoneos/*" | head -1 | xargs -I {} dirname {} | xargs -I {} sh -c 'cd "{}" && zip -r /tmp/Chumian-browser-device.zip ChumianBrowser.app'
      
      - name: Upload Device Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chumian-browser-ios-device
          path: /tmp/Chumian-browser-device.zip
          retention-days: 90
