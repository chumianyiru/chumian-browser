name: iOS Build

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
      
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: Build for Simulator
        run: |
          cd ios
          xcodebuild build \
            -scheme ChumianBrowser \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      
      - name: Package .app
        run: |
          cd ios/build/Build/Products/Debug-iphonesimulator
          zip -r ChumianBrowser-simulator.zip ChumianBrowser.app
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chumian-browser-ios-simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/ChumianBrowser-simulator.zip
          retention-days: 90
