name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew assembleRelease --stacktrace
      
    - name: List APK files
      run: find app/build/outputs/apk -name "*.apk" -type f
      
    - name: Upload APK (arm64-v8a)
      uses: actions/upload-artifact@v4
      with:
        name: chumian-browser-arm64-v8a
        path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
        if-no-files-found: warn
        
    - name: Upload APK (armeabi-v7a)
      uses: actions/upload-artifact@v4
      with:
        name: chumian-browser-armeabi-v7a
        path: app/build/outputs/apk/release/app-armeabi-v7a-release.apk
        if-no-files-found: warn
        
    - name: Upload APK (universal)
      uses: actions/upload-artifact@v4
      with:
        name: chumian-browser-universal
        path: app/build/outputs/apk/release/app-universal-release.apk
        if-no-files-found: warn
        
    - name: Upload all APKs
      uses: actions/upload-artifact@v4
      with:
        name: chumian-browser-all-apks
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: warn
